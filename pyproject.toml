[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regenold-eu-ai-act-rag"
version = "0.1.0"
description = "Standalone EU AI Act grounded Q&A — Regenold partner transparency bundle."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
  {name = "Antifragile AI", email = "compliance@antifragile-ai.net"},
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0,<3",
  "pydantic-settings>=2.4.0",
  "slowapi>=0.1.9",
  "structlog>=24.0.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
mistral = ["mistralai>=1.0.0"]
anthropic = ["anthropic>=0.40.0"]
neo4j = ["neo4j>=5.0.0"]
dev = [
  "pytest>=8.0.0",
  "pytest-xdist>=3.5.0",
  "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "C90"]
ignore = ["E501"]
